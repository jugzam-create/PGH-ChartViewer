const replayStart = "2026-10-08 03:00:00";
const intervalMs = 500;
let timer = null;
let cursor = m1.findIndex(b => b.t >= replayStart);
const initialCursor = cursor;
const chart = document.getElementById("chart");

function aggregate(rows){
  const groups = new Map();
  for(const b of rows){
    const minute = Number(b.t.slice(14,16));
    const bucket = Math.floor(minute/15)*15;
    const key = b.t.slice(0,14)
              + String(bucket).padStart(2,"0") + ":00";
    if(!groups.has(key)){
      groups.set(key,{t:key,o:b.o,h:b.h,l:b.l,c:b.c});
    }else{
      const x=groups.get(key);
      x.h=Math.max(x.h,b.h);
      x.l=Math.min(x.l,b.l);
      x.c=b.c;
    }
  }
  return [...groups.values()];
}

function render(){
  const visible = m1.slice(0,cursor+1);
  const bars = aggregate(visible);
  const last = visible[visible.length-1];
  if(!last || !bars.length)return;

  const trace = {
    type:"candlestick",
    x:bars.map(b=>b.t),
    open:bars.map(b=>b.o),
    high:bars.map(b=>b.h),
    low:bars.map(b=>b.l),
    close:bars.map(b=>b.c),
    increasing:{line:{color:"#19b79c"}},
    decreasing:{line:{color:"#ed6075"}},
    hoverinfo:"x+y"
  };

  const recent = bars.slice(-25);
  const ymin=Math.min(...recent.map(b=>b.l));
  const ymax=Math.max(...recent.map(b=>b.h));
  const pad=Math.max((ymax-ymin)*0.12,0.5);

  Plotly.react(chart,[trace],{
    paper_bgcolor:"#10151d",
    plot_bgcolor:"#10151d",
    font:{color:"#a9b8c9"},
    margin:{l:55,r:12,t:20,b:55},
    xaxis:{
      type:"category",
      rangeslider:{visible:false},
      gridcolor:"#263444"
    },
    yaxis:{
      range:[ymin-pad,ymax+pad],
      gridcolor:"#263444"
    },
    showlegend:false,
    dragmode:"pan"
  },{
    responsive:true,
    displayModeBar:false
  });

  const forming=bars[bars.length-1];
  document.getElementById("status").textContent =
    "再生時刻: "+last.t+" JST"
    +" | 形成中M15: "+forming.t.slice(11,16)
    +" | O "+forming.o.toFixed(3)
    +" H "+forming.h.toFixed(3)
    +" L "+forming.l.toFixed(3)
    +" C "+forming.c.toFixed(3);
}

function step(n){
  cursor=Math.max(
    initialCursor,
    Math.min(m1.length-1,cursor+n)
  );
  render();
  if(cursor===m1.length-1)pause();
}

function pause(){
  if(timer!==null){
    clearInterval(timer);
    timer=null;
  }
  document.getElementById("play").textContent="▶ 再生";
}

function togglePlay(){
  if(timer!==null){pause();return;}
  document.getElementById("play").textContent="⏸ 停止";
  timer=setInterval(()=>step(1),intervalMs);
}

function resetReplay(){
  pause();
  cursor=initialCursor;
  render();
}

render();
</script>
